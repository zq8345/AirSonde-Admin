<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>AirSonde Admin — 产品</title>
<!-- 标签页图标：Joe 定稿的新品牌资产，从官网仓 design/ 原样拷来（**每个文件都做过 sha1 对账**）。
     ⚠️ 这些是静态资源，靠 wrangler.jsonc 的 assets 绑定送出；worker 的 notFound 会把没匹配的路径转交它。
     🔴 `?v=2` 是**破缓存指纹**，不是装饰：favicon 的浏览器缓存极顽固，不换这个串的话，
        换完图你和 Joe 的标签页会**继续显示旧图标**，然后以为是没换成功。
        ⇒ **以后换任何品牌资产，必须同时改这个数字**（这里没有构建步骤，没人会替你算指纹）。 -->
<link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png?v=2" sizes="32x32" type="image/png">
<link rel="icon" href="/favicon-192.png?v=2" sizes="192x192" type="image/png">
<!-- .ico 兜底：老浏览器与某些客户端只认它，且会去请求 /favicon.ico 而不看 link -->
<link rel="icon" href="/favicon.ico?v=2" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
<!-- 🔴 CSS/JS 也带指纹，理由与 favicon 那段相同：这个后台**没有构建步骤**，
     没人会替你算 hash。改了样式却不改这个串，用户刷新看到的还是旧 CSS ——
     而症状是"你说改了，我这儿没变"，最容易被当成"没做"。
     ⚠️ 改 style.css / app.js 时**必须同时改这个数字**。 -->
<link rel="stylesheet" href="/style.css?v=153">
</head>
<body>

<!-- 🔴 内容由 /api/_whoami 的 writeEnabled 决定，不写死。初始是"未知"：
     在问到服务端之前，界面不知道自己能不能写，就不该假装知道。 -->
<div class="banner" id="banner">
  <strong id="bannerTitle">正在确认写入能力…</strong>
  <span id="bannerText">在服务端答复之前，不要假设这里能保存。</span>
  <span class="banner-why" id="bannerWhy"></span>
</div>

<!-- ══ 固定顶栏（Joe 2026-08-12 定：logo 所在的顶栏固定，参考 CRM 后台）══
     ⭐ 用的是 CRM 的**真实做法**，不是 position:fixed：
        页面本身不滚（body 撑满视口、overflow:hidden），滚动发生在下面两个面板**内部**。
        于是顶栏天然停在原地，**不需要给下面的内容算偏移** ——
        而算偏移正是旧写法的病根：`top:40px` 假设横幅永远是一行，
        可横幅一旦带上 warning 就会换行变高，那个 40 就错了，且没人会发现。
     ⚠️ 左格 178 正对左栏 168（度量值取 CRM，crm-skin A 批），字标才会正对侧栏而不是飘在中间。 -->
<header class="topbar">
  <div class="topbar-left">
    <!-- 字标独占，**不带 "Admin" 后缀**（Joe 定：放大、去掉 Admin）。
         ⚠️ 这一条推翻了原派单里的"后缀别丢"——以 Joe 为准，已报总工。
         ⚠️ 带 width/height 属性是为了让浏览器在图到达前就留出位置 —— 不带的话顶栏会先塌后跳。
         ⚠️ alt 写 "AirSonde" 不写 "AirSonde logo"：读屏软件会自己播报"图像"。 -->
    <img class="brand-logo" src="/airsonde-logo-green-transparent.png?v=2" alt="AirSonde" width="1686" height="351">
  </div>
  <!-- 搜索框（Joe 定：顶栏放个搜索框，高度对齐 CRM）。
       🔴 这是**搬过来的那一个**，不是新加一个：列表工具条里原本就有一个搜索框，
          再加一个就会有两个输入框控制同一个筛选 —— 用户不知道哪个在生效，
          而两个都在生效时，"我明明搜了却没结果"这种问题查都没法查。
       ⚠️ 它现在常驻顶栏（顶栏不滚），所以在别的视图里也看得见 ⇒
          在非产品页输入时，自动切回产品页再筛（见 app.js），
          否则会出现"我在设置页打字，什么都没发生"。 -->
  <div class="topbar-right">
    <input type="search" id="q" placeholder="搜标题 / slug / 型号" autocomplete="off">
  </div>
</header>

<div class="app">
  <!-- ── 左侧导航 ── -->
  <!-- 左栏（crm-skin A 批，Joe 2026-09-03：「先设计左侧的导航栏；把设置移到最下面，把账号移到设置里面」）
       结构逐字照 gen-admin.mjs 的 NAV：目录 / 站点 / 系统 三区 + 底部块「设置」。
       图标 = 单色线条 SVG（viewBox 24 · stroke currentColor · 2 · 16px），path 直接抄 mockup。
       ⛔ 已删：「搜索表现 SOON」（GSC 接上那天再回来）· 底部账号块（邮箱/仓/sha/登出 → 设置页）。 -->
  <aside class="sidenav">
   <div class="nav-body">
    <div class="nav-sec">目录</div>
    <!-- ⚠️ aria-current 必须**在 HTML 里就有**：起步时 showNav() 还没跑过，
         只在切换时设的话，刚打开后台的那一刻读屏软件读不出"我在哪一页"。 -->
    <button class="nav-item is-on" data-nav="products" aria-current="page"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg></span>产品<span class="cnt" id="navCount"></span></button>
    <button class="nav-item" data-nav="cats" title="机型 / 传感器两个轴：增删改 + 谁在用"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg></span>分类</button>
    <button class="nav-item" data-nav="media"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></span>图片<span class="cnt" id="navMediaCount"></span></button>

    <div class="nav-div"></div>
    <div class="nav-sec">站点</div>
    <button class="nav-item" data-nav="home" title="首页文案：hero、卖点卡、联系区块"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>首页</button>
    <button class="nav-item" data-nav="contact" title="联系方式：邮箱/电话/微信/地址（链接由它们派生）"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></span>联系方式</button>
    <button class="nav-item" data-nav="seo" title="站级 SEO：各页 title / description"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>SEO</button>
    <!-- 证书：About 页那四张认证卡指向的文件（Joe：「放一个能传证书的地方，我自己传证书进去」）。
         ⚠️ 单独成页而不是塞进「联系方式」：证书不是联系方式，塞进去他不会到那儿去找；
            也不能进 SITE_SECTIONS —— 那一族是"填表单再点保存"，而证书是**传完当场就提交**。 -->
    <button class="nav-item" data-nav="certs" title="CE / FCC / RoHS / UN38.3 四张证书：上传、替换、删除"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15a5 5 0 1 0 0-10 5 5 0 0 0 0 10z"/><path d="M8.5 14.5L7 22l5-3 5 3-1.5-7.5"/></svg></span>证书</button>

    <div class="nav-div"></div>
    <div class="nav-sec">系统</div>
    <button class="nav-item" data-nav="audit"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></span>审计日志</button>
    <!-- ✅ 这一条是真链接：询盘归 CRM 管 -->
    <a class="nav-item" href="https://crm.airsonde.com" target="_blank" rel="noopener"
       title="询盘/线索归 CRM 管理（新标签打开）"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg></span>询盘<span class="ext">↗</span></a>
   </div>
   <div class="nav-bottom">
    <button class="nav-item" data-nav="settings" title="账号 · 保存与上线 · 版本"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg></span>设置</button>
   </div>
  </aside>

  <main class="main">
    <!-- ══════ 列表视图 ══════ -->
    <section id="listView">
      <!-- 🔴 官网构建状态（审计① / Joe 2026-09-04）。空着时不占位置。
           它替掉的是那句**恒为真**的「已提交，线上生效有延迟」——
           官网 09:53 停到 12:43 才被发现，而那三小时里后台一直在说同一句话。
           ⚠️ 三态都要说得出口：正常(不显示) / 停了(红) / **无法确认(也必须说)**。 -->
      <div id="siteBuildBar"></div>
      <!-- crm-skin B 批（§3）：⛔ 原 全部/在线/未上架 tab 条 + 「全部机型」下拉已删（元素 + 绑定 + state.tab 三处）。
           筛选住列头：「状态」= 两段切换 在线|未上架（默认无选中 = 全部）；「机型」= 漏斗菜单。「产品」列头不放任何控件。 -->
      <div class="page-head">
        <h1>产品</h1><span class="page-sub" id="listSub"></span>
        <!-- ⭐ Joe 2026-09-04：「把这些操作集成到工具栏，也就是 + 新建产品 按钮那一行」。
             ⇒ 整块搬进 .page-head（原来在表格之后 + 吸底）。
                现有四样：已选计数 · 批量上架 · 批量下架 · 批量改机型。
                ⚠️ 原本还有第五样「取消选择」，Joe 2026-09-04 点名删掉了（见下方注释）——
                   这句话跟着改，⛔ 不留一句"五样一个不少"在这里替一个已经没有的东西作证。

             ⚠️ 搬家丢掉的那条设计要说清楚，⛔ 不静默丢：
                原位置（表格之后 + sticky bottom）是为了**勾选时上面的行不动** ——
                更早它在表格之前占文档流，勾一行、正在看的那行当场下移 145px。
                现在它回到表格上方 ⇒ **出现时下面的表格会下移**（实测见交付：约一行的高度）。
                这是 Joe 明确要的位置，⛔ 不替他推翻；但代价记在这里，别下次当成 bug 再改回去。

             🔴 那句后果说明（一次批量 = 一个 commit …）**必须在他点之前看得见**，
                所以它没有被删，而是 flex-basis:100% 落到按钮下面自成一行 ——
                ⛔ 不跟按钮抢横向空间（990 分屏那一行本来就快装不下了）。 -->
        <div class="batchbar" id="batchBar" hidden>
          <span id="batchCount"></span>
          <button type="button" data-bulk="published">批量上架</button>
          <button type="button" data-bulk="draft">批量下架</button>
          <!-- 机型是产品的**归属**，不是轴本身。两件事都在写入范围内，但是两个文件：
               归属在产品 JSON，轴本身在 src/data/taxonomy.json（分类页）。 -->
          <select id="bulkCat"><option value="">批量改机型…</option></select>
          <!-- ⛔ 「取消选择」按钮已删（Joe 2026-09-04：「把取消选择干掉就可以了」）。
               取消的**能力没丢**：表头那个 ⊟ 全选框再点一下就清空（实测 25 → 0）。
               ⚠️ 但两者不等价，代价记在这里：从**部分选中**（indeterminate）点 ⊟，
                  第一下是**全选**、第二下才清零 —— 原来那个按钮任何状态下一下就清。
               ⚠️ 元素与绑定**一起删**（app.js 里那行 `$("#batchClear").onclick` 同时删掉）：
                  只删元素的话 `$()` 返回 null，`null.onclick` 当场抛，**整个 app.js 停在那一行**，
                  后面所有绑定都不会挂上 —— 而屏幕上看起来只是"按钮没了"。 -->
        </div>
        <!-- 🔴 这句后果说明**必须在他点之前看得见**（⛔ 不许静默删、⛔ 不许只留在注释里）。
             ⚠️ 它是 .page-head 的**直接子元素**，不在 .batchbar 里 —— 实测过放里面的后果：
                它带着 flex-basis:100% 会把 .batchbar 撑到"整句话那么宽"(763px)，
                于是 + 新建产品 被挤到第二行、工具栏从 36px 涨到 176px。
             ⇒ 放外面它独占一整行，⛔ 不与任何按钮抢横向空间。
             显隐与 #batchBar 同一个条件，由 renderBatch() 一处说了算。 -->
        <button type="button" class="primary" id="newBtn">+ 新建产品</button>
        <span class="batch-note" id="batchNote" hidden>一次批量 = 一个 commit；任一产品不过契约闸则整批不写。</span>
      </div>

      <!-- 🔴 删除等动作的结果落在这里（与分类页的 #catsResult 同一个形状，⛔ 不新造）。
           ⚠️ 删除成功后界面会**切回列表**，结果不能落在详情页的 #preview 上 ——
              那样"已删除 + commit"这句话会随详情页一起消失，他不知道到底删没删。 -->
      <div id="listResult"></div>
      <div class="table-wrap card table">
        <table class="ptable">
          <thead><tr>
            <th class="col-ck"><input type="checkbox" id="ckAll" title="全选当前筛选结果"></th>
            <th class="col-img">图片</th>
            <th>产品</th>
            <th class="col-st ac" id="thStatus"></th>
            <!-- A12-③ 型号独立成列：Joe 要逐个核对 23 个型号，
                 独立一列他扫一眼就知道哪些还是 AS-（挤在 slug 后面做不到）。
                 A15 可点排序（Joe 2026-08-28）：原生 button（键盘可达），箭头由 app.js 填。 -->
            <th class="col-model" id="thModel"><button type="button" class="th-sortbtn" id="sortModelBtn" title="按型号排序，再点反序">型号<span id="sortModelArrow" aria-hidden="true"></span></button></th>
            <th class="col-cat filt" id="thCat">机型</th>
            <th class="col-act">操作</th>
          </tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="empty" id="listEmpty" hidden></div>
    </section>

    <!-- ══════ 分类（机型 / 传感器 两个轴）══════
         契约 v1.4 起**可管理**：两个轴的真源是官网仓 src/data/taxonomy.json，后台可增删改。
         ⚠️ 这一页从前写着"这一轴是冻结的，改轴走总工" —— 那句话已作废，而且**留着它比没有更糟**：
            人会照它去找总工，而总工会说"你自己在后台改"。
         🔴 删除在用的取值时官网构建**不会**兜底（实测，见 src/taxonomy.ts 顶部四层实验）
            ⇒ 这一页的引用计数是唯一防线，它必须准，而且拒绝时必须把"谁在用"列出来。 -->
    <section id="catsView" hidden>
      <!-- crm-skin B 批（§5）：页头副标由真值算（原绿色横幅撤）；两张表卡并排；卡头 = 标题 + 灰副标 + 右端「管理」；
           机型只留显示名一行（取值收进 title / 管理态）；传感器排两列，两卡等高。 -->
      <div class="page-head"><h1>分类</h1><span class="page-sub" id="catsSub"></span></div>
      <div id="catsSummary"></div>
      <!-- 🔴 写入结果**独占一格**，与上面的实况对账分开。
           实测过混在一起的样子：一次被拒的提交留在屏幕上，下一次提交的结果叠在它旁边 ——
           两条关于两次操作的消息同时在场，人只会读离得近的那条。
           分开之后，"这一格里永远只有最近一次提交的结果"是**结构上成立**的，不靠记得去清。 -->
      <div id="catsResult"></div>
      <div class="two">
        <!-- ⭐ 管理态开关（Joe 2026-08-26 定：改名/删除/新增要点「管理」才出现）。
             🔴 **两栏各有各的开关**：管机型时不该把传感器那栏也解锁。
             ⚠️ 新增本身不具破坏性、本可常驻 —— 但三个动作收进同一个开关是**一条规则、不留特例**。
             按钮内容（扳手线条图标 + 管理/管理中）由 syncManageBtns() 填。 -->
        <div class="card table">
          <div class="cth"><span class="sec-title">机型</span>
            <button type="button" class="btn-secondary btn-mini managebtn" aria-pressed="false" data-axis="categories"
                    title="进入管理态才能改名 / 删除 / 新增">管理</button>
            <!-- 「全部放弃」：只在编辑态且真有未保存改动时出现（syncManageBtns 控制显隐）。
                 ⚠️ 它必须**说清放弃了什么** —— 一句"确定放弃？"回答不了"我会失去什么"。 -->
            <button type="button" class="linkish discardbtn" data-axis="categories" hidden>全部放弃</button>
          </div>
          <table class="ptable">
            <thead><tr>
              <th>机型</th>
              <th class="col-st ac">在用</th>
              <th class="col-cat">状态</th>
              <th class="col-act"></th>
            </tr></thead>
            <tbody id="catsRows"></tbody>
          </table>
          <!-- 单输入（Joe 2026-09-03）：取值由名字自动派生（机型 slugify），⛔ 不再让人填第二个框 -->
          <form class="axisadd" id="addCategories" hidden>
            <input type="text" name="label" placeholder="名字（如 Wall-mounted）" autocomplete="off">

        <!-- slug 在界面上叫「网址」（Joe：「slug 是啥，我不太明白」，D 批 §4）：
             灰前缀 airsonde.com/products/ + slug；新建自动生成可改，编辑态只读（改 slug = 改文件名，本阶段不支持）。
             ⚠️ 自动值**必须看得见且可改**，不许藏起来：藏起来的话，人是在提交之后才第一次看到这个网址。 -->
        <div class="field">
          <!-- v3 §3.3：`slug · 上线后锁定` 那行小字进 (?)（(?) 里已经写着"上线后锁定"了）。 -->
          <label class="flab" for="f_slug">网址 <span class="q2" title="由产品标题自动生成，新建时可以改；上线后锁定——改了等于换网址，搜索引擎和已经发出去的链接都会失效。">?</span></label>
          <div class="urlwrap"><span class="urlpre">airsonde.com/products/</span><input id="f_slug" name="slug" spellcheck="false"></div>
          <p class="hint" id="slugHint" hidden>由标题自动生成，现在可以改；上线后锁定。</p>
        </div>

        <!-- A16 Meta description（总工派单 2026-09-03，Joe 确认「安排」）。v3 搬到网址下面（Joe 定）。
             官网产品页 <meta name="description"> 与 og:description 都用它；留空 ⇒ 官网沿用自动拼接。
             🔴 硬限 160、超出计数变红且**保存按钮禁用** —— 这套逻辑**必须跟着搬过来**，
                ⛔ 别在删「更多」卡的时候一起丢了（服务端契约同样硬拒，界面只是先告诉你）。
             ⚠️ 空值保存 = 字段不写（readForm 送 null ⇒ 服务端删键），⛔ 不是写空串。 -->
        <div class="field">
          <label for="f_metadesc">Meta description <span class="q2" title="搜索结果里显示的那句话。留空的话官网会用自动拼接的描述。最多 160 个字符，超了保存会被禁用。">?</span></label>
          <textarea id="f_metadesc" name="metaDescription" rows="2" spellcheck="true" data-anchor="metaDescription"></textarea>
          <div class="shint" id="f_metadesc_cnt"></div>
        </div>

        </section>

        <!-- ══ 卖点：v3 第三张卡（⛔ 它之后没有别的卡了）══ -->
        <section class="card">
          <h3>卖点 <span class="q2" title="一行一条。可以从阿里/电商后台整段复制粘贴进来，保存时按换行拆开，行首的项目符号和序号会自动去掉。">?</span><span class="cnt" id="hlCount"></span></h3>

          <!-- A17 卖点改成一个大输入框（Joe 2026-09-03）：「留个大输入框，我们一次性复制粘贴进去；
               卖点基本是 AI 写的或从电商平台复制的，现在要复制 6 次」。
               一行一条。保存时按换行拆回 highlights: string[]（契约不变，官网不用动）；
               每行 trim、去行首项目符号/序号、去不可见字符（零宽/BOM/U+FFFC/私用区），空行丢弃。
               ⚠️ 原来的逐条输入框 + 「N 个字符，契约说的是短句」黄字已撤，只留一行灰字「共 N 条」。 -->
          <!-- G 批 §6：8 行内滚 → 自动长高。Joe 的用法是**整段粘贴**，
               ⚠️ 内滚框会把"我到底粘进去了几条"藏在视口外面 —— 那正是他要看的那件事。
               rows=4 = 地板；再高由**布局**顶开（`.grow-wrap` 的替身 ::after，见 style.css），
               ⛔ 不由 JS 量 —— 量就要挑时刻和挑宽度，而那三个坑全踩过了（syncGrow 的注释里有实测数）。 -->
          <div class="grow-wrap">
            <textarea id="f_highlights" name="highlights" rows="4" spellcheck="true" data-anchor="highlights" data-autogrow placeholder="从阿里 / 电商后台整段复制粘贴进来即可，一行一条。"></textarea>
          </div>
        </section>

        <!-- 🔴 supplierRef 的输入框与那段红字已删（Joe 2026-09-04：「supplierRef 内部字段干掉」）。
             ⚠️ 他说的是**输入框**，⛔ 没说数据 —— 实测 36 个产品里 20 个此刻存着值，
                AK35 那条是阿里巴巴链接、别处无备份。
             ⇒ readForm **完全不提这个键**（与 moq 同一种处理），服务端因此保持原值不动。
                ⛔ 绝不能送 null：那是「显式清空」，会让他每保存一个产品就静默抹掉一条链接。
             ⚠️ 契约里「供应商链接粘进 specs / highlights 会被拒」那道校验**一个字没动**。 -->

        </div><!-- /edit-col-main -->
        </div><!-- /edit-grid -->

        <!-- ⚠️ images.main 的路径仍然由**服务端**（planImages）算。这里留一个隐藏字段
             只为了把当前值带回去，不给人手填 —— 手填等于让人去维护一条服务端已经在维护的规则。
             ⚠️ 隐藏而不是删掉：readForm 仍然读它，删了会让 images.main 变成空。 -->
        <input type="hidden" id="f_imgmain" name="images.main">
        <!-- ⛔ v3 已删（Joe 2026-09-04）：
             · #recordCard「记录」整块 —— ⚠️ 连带后果：编辑页不再有「谁在什么时候改了什么」的入口。
               总工建议审计日志页支持按产品筛选，但 **Joe 尚未点头 ⇒ 本单不做**，
               ⛔ 也不许偷偷把记录卡留着假装没删。
             · #dSitePath「官网 路径」—— 与「网址」字段是同一个事实，⛔ 不占两个显示位。
             · #dSiteLink「看官网页 ↗」—— Joe 点名删。 -->

        <div class="actions">
          <span class="actions-note" id="actionsNote"></span>
        </div>
      </form>

      <div id="preview" hidden></div>
    </section>
  </main>
</div>

<script src="/app.js?v=153"></script>
</body>
</html>
